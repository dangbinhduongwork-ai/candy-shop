# =============================================
# MySQL Profile Configuration
# Activate with: spring.profiles.active=mysql
# =============================================

# --- MySQL Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/candy_shop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

# --- JPA / Hibernate for MySQL ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console for MySQL profile
spring.h2.console.enabled=false
