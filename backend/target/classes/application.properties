# =============================================
# APPLICATION CONFIGURATION (H2 - Development)
# =============================================
spring.application.name=candy-shop-backend
server.port=8080

# --- H2 In-Memory Database (default profile for development) ---
spring.datasource.url=jdbc:h2:mem:candyshop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console for easy data inspection during development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT Configuration ---
# IMPORTANT: Change this secret to a strong, random value in production!
app.jwt.secret=ZmVlYTBkMDI2YWEzMzJlOGY3YzJkYTc2NWNhMmU4YjFkOWUzMDVjODc0NzY1YWZhMzQ1NDJkM2FiYzU1NTA4Nw==
app.jwt.expiration-ms=86400000

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173
