# =============================================
# APPLICATION CONFIGURATION (H2 - Development)
# =============================================
spring.application.name=candy-shop-backend
server.port=8080

# --- H2 In-Memory Database (default profile for development) ---
spring.datasource.url=jdbc:h2:mem:candyshop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console for easy data inspection during development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT Configuration ---
# IMPORTANT: Change this secret to a strong, random value in production!
app.jwt.secret=ZmVlYTBkMDI2YWEzMzJlOGY3YzJkYTc2NWNhMmU4YjFkOWUzMDVjODc0NzY1YWZhMzQ1NDJkM2FiYzU1NTA4Nw==
app.jwt.expiration-ms=86400000

# --- CORS (nhiều origins phân cách bởi dấu phẩy) ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- File Upload Configuration ---
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- Google reCAPTCHA v2 Configuration ---
# Default is Google's official Test Secret Key for localhost (always passes server verification)
# In production, replace with your real secret key from https://www.google.com/recaptcha/admin
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
app.recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify
app.recaptcha.enabled=true
# --- High-Concurrency Tomcat & Virtual Threads (Java 21 Loom) ---
spring.threads.virtual.enabled=true
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=10000
server.tomcat.accept-count=1000
server.tomcat.connection-timeout=20000

# --- Caching & Redis Configuration ---
spring.cache.type=simple
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# --- Flyway Migrations (Disabled for H2 development by default) ---
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- Observability & Actuator Metrics ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.prometheus.metrics.export.enabled=true

